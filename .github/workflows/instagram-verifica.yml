name: Vale & Rossy | VERIFICA token Instagram (senza pubblicare)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/instagram-verifica.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - name: Controlla token e account (sola lettura, zero pubblicazioni)
        shell: bash
        run: |
          python - <<'PY'
          import os, json, sys, urllib.request, urllib.error
          token=os.environ.get('IG_ACCESS_TOKEN','').strip()
          if not token:
              print('ERRORE: il secret IG_ACCESS_TOKEN non è presente o è vuoto.')
              sys.exit(1)
          url='https://graph.facebook.com/v25.0/17841480799194797?fields=id%2Cusername'
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/json',
              'User-Agent':'ValeRossyReadOnlyVerifier/1.0'
          })
          try:
              with urllib.request.urlopen(req,timeout=25) as res:
                  data=json.load(res)
          except urllib.error.HTTPError as e:
              try:
                  obj=json.loads(e.read().decode('utf-8')).get('error',{})
                  print('ERRORE META: '+str(obj.get('message','API non autorizzata'))[:300]+' | codice '+str(obj.get('code','?')))
              except Exception:
                  print('ERRORE META HTTP '+str(e.code))
              sys.exit(1)
          except Exception as e:
              print('ERRORE CONNESSIONE: '+type(e).__name__)
              sys.exit(1)
          username=data.get('username','').lower()
          if str(data.get('id'))!='17841480799194797' or username!='ticonciamoperlefeste2026':
              print('ERRORE: il token non corrisponde all’account Instagram Vale & Rossy.')
              sys.exit(1)
          print('OK: IG_ACCESS_TOKEN funziona.')
          print('OK: Account riconosciuto: @ticonciamoperlefeste2026.')
          # Test aggiuntivi in sola lettura: quota e accesso ai contenuti.
          for route,fields,label in (
              ('content_publishing_limit','quota_usage,config','quota pubblicazioni'),
              ('media','id,caption','lettura media'),
          ):
              base='https://graph.facebook.com/v25.0/17841480799194797/'+route
              test_url=base+'?fields='+fields.replace(',','%2C')+('&limit=1' if route=='media' else '')
              test_req=urllib.request.Request(test_url,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/json',
                  'User-Agent':'ValeRossyReadOnlyVerifier/1.0'
              })
              try:
                  with urllib.request.urlopen(test_req,timeout=25) as resp:
                      test_data=json.load(resp)
              except urllib.error.HTTPError as exc:
                  try:
                      err=json.loads(exc.read().decode('utf-8')).get('error',{})
                      print('NON VERIFICATO '+label+': '+str(err.get('message','API non autorizzata'))[:250]+' (code '+str(err.get('code','?'))+')')
                  except Exception:
                      print('NON VERIFICATO '+label+': HTTP '+str(exc.code))
                  continue
              except Exception as exc:
                  print('NON VERIFICATO '+label+': '+type(exc).__name__)
                  continue
              if route=='content_publishing_limit':
                  entry=(test_data.get('data') or [test_data])[0]
                  print('OK: API quota accessibile; utilizzo='+str(entry.get('quota_usage','non comunicato')))
              else:
                  print('OK: API media Instagram accessibile in sola lettura.')
          print('Questo controllo non ha pubblicato, modificato o eliminato alcun post.')
          PY
